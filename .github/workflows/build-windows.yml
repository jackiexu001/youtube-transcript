name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Run Python regression tests
        shell: powershell
        run: |
          python -m unittest -v test_youtube_caption.py test_desktop_release.py
          python -m unittest discover -s mvp -p "test_*.py" -v
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build application and installer
        shell: powershell
        run: .\build_windows_exe.ps1
      - name: Smoke-test installer and installed application
        shell: powershell
        run: |
          $installer = Get-ChildItem "release/windows/*-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found." }
          $installDir = Join-Path $env:RUNNER_TEMP "YouTubeCaptionArchive"
          $install = Start-Process $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installation failed with exit code $($install.ExitCode)." }
          @("YouTube Transcript.exe", "youtube-caption-backend.exe", "yt-dlp.exe", "ffmpeg.exe") | ForEach-Object {
            if (-not (Test-Path (Join-Path $installDir $_))) { throw "Installed file missing: $_" }
          }
          $encoders = & (Join-Path $installDir "ffmpeg.exe") -hide_banner -encoders 2>&1
          if (-not ($encoders -match "\saac\s")) { throw "Installed FFmpeg is missing the AAC encoder." }
          & (Join-Path $installDir "youtube-caption-backend.exe") --help
          if ($LASTEXITCODE -ne 0) { throw "Installed backend failed to start." }
          $app = Start-Process (Join-Path $installDir "YouTube Transcript.exe") -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed desktop application exited during startup." }
          Stop-Process -Id $app.Id -Force
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: YouTube-Transcript-Windows-x64
          path: |
            release/windows/*-Setup.exe
            release/windows/*-Setup.exe.sha256
          if-no-files-found: error
